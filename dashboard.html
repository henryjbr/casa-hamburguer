<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Casa Burguer | Dashboard</title>
    <meta name="description" content="Dashboard local para gerenciar o cardápio da Casa Burguer.">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body data-page="dashboard">
    <header class="site-header dashboard-header" data-elevated>
      <a class="brand-link" href="index.html" aria-label="Casa Burguer">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48"><path d="M13 27V15l11-6 11 6v12"/><path d="M35 15h5v12"/><path d="M40 4c6 7-4 11 2 18-10-5-6-13-2-18Z"/></svg>
        </span>
        <span class="brand-word">
          <strong>Casa</strong>
          <span>Burguer</span>
        </span>
      </a>
      <nav class="nav-links" aria-label="Navegação do dashboard">
        <a href="index.html">Vitrine</a>
        <a href="#editor">Editor</a>
        <a href="#lista">Itens</a>
      </nav>
    </header>

    <main class="dashboard-shell">
      <section class="dashboard-title" aria-labelledby="dashboard-title">
        <div>
          <p class="eyebrow">Dashboard exclusivo</p>
          <h1 id="dashboard-title">Casa Burguer</h1>
        </div>
        <div class="dashboard-stats" aria-label="Resumo do cardápio">
          <div><strong id="stat-items">0</strong><span>itens</span></div>
          <div><strong id="stat-active">0</strong><span>ativos</span></div>
          <div><strong id="stat-highlight">0</strong><span>destaques</span></div>
        </div>
      </section>

      <section class="dashboard-layout" id="editor">
        <form class="editor-panel" id="menu-form">
          <input type="hidden" id="item-id">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Cardápio</p>
              <h2 id="form-title">Novo item</h2>
            </div>
            <button class="icon-button" type="button" id="clear-form" aria-label="Limpar formulário">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/></svg>
            </button>
          </div>
          <div class="form-grid">
            <label>
              <span>Nome do prato</span>
              <input id="item-name" required maxlength="60" placeholder="Ex.: Jardim">
            </label>
            <label>
              <span>Categoria</span>
              <select id="item-category" required>
                <option>Burgers</option>
                <option>Combos</option>
                <option>Porções</option>
                <option>Bebidas</option>
              </select>
            </label>
            <label>
              <span>Preço</span>
              <input id="item-price" type="number" min="0" step="0.01" required placeholder="38.00">
            </label>
            <label>
              <span>Imagem</span>
              <input id="item-image-file" type="file" accept="image/*">
            </label>
            <label class="full">
              <span>URL ou caminho da imagem</span>
              <input id="item-image" placeholder="assets/jardim-card.jpg">
            </label>
            <label class="full">
              <span>Foto desmembrada</span>
              <input id="item-exploded" placeholder="assets/jardim-exploded.jpg">
            </label>
            <label class="full">
              <span>Ingredientes</span>
              <textarea id="item-ingredients" rows="4" placeholder="Um ingrediente por linha"></textarea>
            </label>
            <label class="full">
              <span>Descrição</span>
              <textarea id="item-description" rows="4" required maxlength="220" placeholder="Pão, burger artesanal, queijo e molho da casa."></textarea>
            </label>
          </div>
          <div class="switch-row">
            <label class="switch">
              <input id="item-active" type="checkbox" checked>
              <span>Disponível</span>
            </label>
            <label class="switch">
              <input id="item-featured" type="checkbox">
              <span>Destaque</span>
            </label>
          </div>
          <button class="button primary wide" type="submit">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
            Salvar item
          </button>
        </form>

        <aside class="preview-panel" aria-labelledby="preview-title">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Preview</p>
              <h2 id="preview-title">Na vitrine</h2>
            </div>
          </div>
          <article class="menu-card preview-card">
            <div class="menu-image-wrap">
              <img id="preview-image" src="assets/jardim-card.jpg" alt="">
              <span class="pill" id="preview-category">Burgers</span>
            </div>
            <div class="menu-card-body">
              <div class="menu-card-title">
                <h3 id="preview-name">Novo burger</h3>
                <strong id="preview-price">R$ 0,00</strong>
              </div>
              <p id="preview-description">Descrição do prato.</p>
              <button class="button secondary" type="button" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16"/><path d="M5 19a7 7 0 0 1 14 0"/><path d="M12 4v3"/><path d="M8 7l-2-2"/><path d="M16 7l2-2"/></svg>
                Ingredientes
              </button>
            </div>
          </article>
          <button class="button danger wide" type="button" id="reset-menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v6h6"/></svg>
            Restaurar cardápio
          </button>
        </aside>
      </section>

      <section class="items-section" id="lista" aria-labelledby="items-title">
        <div class="section-heading compact">
          <div>
            <p class="eyebrow">Itens cadastrados</p>
            <h2 id="items-title">Cardápio atual</h2>
          </div>
        </div>
        <div class="dashboard-list" id="dashboard-list"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
